name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR — saves Actions minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-lint:
    name: Edge Node Lint (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: edge/requirements.txt
      - run: pip install ruff
      - run: ruff check .

  edge-tests:
    name: Edge Node Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: edge-lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: edge/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest-cov
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: edge-coverage
          path: edge/coverage.xml
          retention-days: 14

  edge-security:
    name: Edge Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: edge-lint
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: edge/requirements.txt
      - run: pip install pip-audit
      - run: pip install -r requirements.txt
      - name: Audit Python dependencies
        run: pip-audit --strict --desc
        continue-on-error: true  # Advisory — don't block PRs on upstream vulns

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-security:
    name: Frontend Dependency Audit (npm)
    runs-on: ubuntu-latest
    needs: frontend-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true  # Advisory — don't block PRs on upstream vulns
